# Cloudflare Pages project for IrishBredEventers.
# Static pages live in /public, server code in /functions (Pages Functions).
name = "irishbredeventers"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "irishbredeventers"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"   # from: npx wrangler d1 create irishbredeventers
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "irishbredeventers-media"

[vars]
# Public web address, used in email links. Change once the .ie domain is live.
SITE_URL = "https://irishbredeventers.pages.dev"
# Cloudflare Access (Zero Trust) team domain and the Application Audience (AUD) tag for /admin.
ACCESS_TEAM_DOMAIN = "REPLACE.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_AUD_TAG"
# Only these emails may use the owner area (comma separated). Leave empty to trust the Access policy alone.
ADMIN_EMAILS = ""
# Turnstile site key (public). The secret goes in as a secret: TURNSTILE_SECRET.
TURNSTILE_SITE_KEY = ""
# Mailing service: "resend" or "brevo". The API key goes in as a secret: MAIL_API_KEY.
MAIL_PROVIDER = "resend"
MAIL_FROM = "IrishBredEventers <results@irishbredeventing.ie>"
